<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Match Game</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }

        .main-animal {
            font-size: 2rem;
            color: #fff;
            text-align: center;
            animation: popIn 0.5s ease-out;
            font-weight: bold;
        }

        .options-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 20px;
        }

        .option {
            width: 120px;
            height: 120px;
            background: #ffffffaa;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-out;
            cursor: pointer;
            overflow: hidden;
        }

        .option img {
            max-width: 100%;
            max-height: 100%;
        }

        .option:hover {
            transform: scale(1.15);
            background: #f1a1d1;
        }

        .confetti {
            position: absolute;
            top: 0;
            width: 5px;
            height: 10px;
            background: #ffec61;
            opacity: 0.8;
            animation: confetti 2s linear infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="main-animal" id="target">?</div>
    <div class="options-container" id="options"></div>

    <script>
        const animals = [
            { name: "Elephant", img: "elephant.jpg" },
            { name: "Lion", img: "lion.jpg" },
            { name: "Tiger", img: "tiger.jpg" },
            { name: "Giraffe", img: "giraffe.jpg" },
            { name: "Monkey", img: "monkey.jpg" },
            { name: "Zebra", img: "zebra.jpg" },
            { name: "Kangaroo", img: "kangaroo.jpg" },
            { name: "Bear", img: "bear.jpg" },
            { name: "Panda", img: "panda.jpg" },
            { name: "Wolf", img: "wolf.jpg" }
        ];

        let currentAnimal = "";

        // Confetti Function to Celebrate Correct Answer
        function addConfetti() {
            for (let i = 0; i < 50; i++) {
                const div = document.createElement('div');
                div.className = 'confetti';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.animationDuration = 2 + Math.random() * 3 + 's';
                div.style.background = `hsl(${Math.random() * 360}, 100%, 80%)`;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 5000);
            }
        }

        function sebut(animalName) {
            const utterance = new SpeechSynthesisUtterance(animalName);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function startAnimalGame() {
            const randomIndex = Math.floor(Math.random() * animals.length);
            currentAnimal = animals[randomIndex];
            const targetEl = document.getElementById('target');
            targetEl.innerText = currentAnimal.name;

            sebut(currentAnimal.name);

            const choices = [currentAnimal];
            while (choices.length < 3) {
                const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
                if (!choices.includes(randomAnimal)) choices.push(randomAnimal);
            }
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options');
            container.innerHTML = "";

            choices.forEach((animal) => {
                const btn = document.createElement("div");
                btn.className = "option";
                btn.innerHTML = `<img src="${animal.img}" alt="${animal.name}" />`;
                btn.onclick = () => checkAnimalAnswer(animal);
                container.appendChild(btn);
            });
        }

        function checkAnimalAnswer(selected) {
            sebut(selected.name);
            if (selected.name === currentAnimal.name) {
                addConfetti();
                setTimeout(() => startAnimalGame(), 1500);
            } else {
                alert("Oops! Wrong pick. Try again!");
            }
        }

        startAnimalGame();
    </script>
</body>
</html>
