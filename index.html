<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Match Game</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes confetti {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .main-letter {
            font-size: 12rem;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            animation: popIn 0.5s ease-out;
        }

        .options-container {
            display: flex;
            gap: 1rem;
        }

        .option {
            width: 5rem;
            height: 5rem;
            background: #ffffff99;
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-out;
        }

        .option:hover {
            transform: scale(1.2);
            background: #ffcfdf;
            cursor: pointer;
        }

        .confetti {
            position: absolute;
            top: 0;
            width: 5px;
            height: 10px;
            background: #ffec61;
            opacity: 0.8;
            animation: confetti 2s linear infinite;
        }

    </style>
</head>
<body>

    <div class="main-letter" id="target">?</div>
    <div class="options-container" id="options"></div>

    <script>
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        let currentLetter = "";

        // Confetti Function to Celebrate Correct Answer
        function addConfetti() {
            for (let i = 0; i < 50; i++) {
                const div = document.createElement('div');
                div.className = 'confetti';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.animationDuration = 2 + Math.random() * 3 + 's';
                div.style.background = `hsl(${Math.random() * 360}, 100%, 80%)`;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 5000);
            }
        }

        function sebut(teks) {
            const utterance = new SpeechSynthesisUtterance(teks);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function startGame() {
            currentLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
            const targetEl = document.getElementById('target');
            targetEl.innerText = currentLetter;

            sebut(currentLetter);

            const choices = [currentLetter];
            while (choices.length < 3) {
                let letter = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!choices.includes(letter)) choices.push(letter);
            }
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options');
            container.innerHTML = "";

            choices.forEach((letter) => {
                const btn = document.createElement("div");
                btn.className = "option";
                btn.innerText = letter;
                btn.onclick = () => checkAnswer(letter, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, element) {
            sebut(selected);
            if (selected === currentLetter) {
                element.style.background = "green";
                addConfetti();
                setTimeout(() => startGame(), 1500);
            } else {
                element.style.background = "red";
                element.style.animation = "shake 0.3s";
                setTimeout(() => (element.style.background = ""), 500);
            }
        }

        startGame();
    </script>
</body>
</html>
