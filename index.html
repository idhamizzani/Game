<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABC Match Fun & Voice</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .main-letter {
            font-size: 150px;
            color: #4A90E2;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px 70px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: popIn 0.5s ease-out;
        }

        .options-container {
            display: flex;
            gap: 15px;
        }

        .option {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: #4A90E2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .option:active { transform: scale(0.8); }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            backdrop-filter: blur(15px);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="initGame()">
        <h1 style="color: #4A90E2;">Tekan Jom Mula! 🍎</h1>
    </div>

    <div class="main-letter" id="target">?</div>
    <div class="options-container" id="options"></div>

    <script>
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        let currentLetter = "";
        
        // Bunyi kesan khas (SFX)
        const soundCorrect = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
        const soundWrong = new Audio('https://actions.google.com/sounds/v1/foley/button_click.ogg');

        // Fungsi Sebutan Suara
        function sebut(teks) {
            const utterance = new SpeechSynthesisUtterance(teks);
            utterance.lang = 'en-US'; // Sebutan abjad lebih jelas dalam English
            utterance.rate = 0.8; // Perlahankan sikit supaya anak mudah dengar
            window.speechSynthesis.speak(utterance);
        }

        function initGame() {
            document.getElementById('start-overlay').style.display = 'none';
            // Trigger suara kosong untuk "unlock" audio di iOS
            sebut(""); 
            startGame();
        }

        function startGame() {
            currentLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
            const targetEl = document.getElementById('target');
            targetEl.innerText = currentLetter;
            
            // Sebut huruf yang perlu dicari
            sebut(currentLetter);

            targetEl.style.animation = 'none';
            targetEl.offsetHeight; 
            targetEl.style.animation = 'popIn 0.5s ease-out';

            let choices = [currentLetter];
            while (choices.length < 3) {
                let randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!choices.includes(randomLetter)) choices.push(randomLetter);
            }
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options');
            container.innerHTML = "";
            
            choices.forEach(letter => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = letter;
                btn.onclick = () => checkAnswer(letter, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, element) {
            // Sebut huruf yang anak tekan
            sebut(selected);

            if (selected === currentLetter) {
                soundCorrect.play();
                element.style.background = "rgba(76, 175, 80, 0.6)";
                setTimeout(startGame, 1000); // Beri masa 1 saat sebelum tukar huruf
            } else {
                soundWrong.play();
                element.style.animation = 'shake 0.3s';
                element.style.background = "rgba(244, 67, 54, 0.6)";
                setTimeout(() => {
                    element.style.animation = '';
                    element.style.background = "";
                }, 300);
            }
        }
    </script>
</body>
</html>
